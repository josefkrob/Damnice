<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skryté vinařské předměty</title><style>body{margin:0;background:#17120d;color:#fff8e9;font-family:system-ui}.wrap{max-width:1200px;margin:auto}.bar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:#241a12}.game{position:relative;line-height:0}.game img{width:100%;display:block}.hot{position:absolute;border:0;background:transparent;cursor:pointer}.hot.found{pointer-events:none}.mark{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#52772f;border:3px solid #fff;font-size:20px;line-height:1;pointer-events:none}.targets{background:#ead8ae;color:#33261a;padding:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.item{padding:8px;border-radius:8px;background:#ffffff55;text-align:center}.item.found{opacity:.42;filter:grayscale(1);text-decoration:line-through}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000d;padding:8px 12px;border-radius:10px;opacity:0}.toast.show{opacity:1}.done{display:none;position:absolute;inset:0;place-items:center;background:#0008;z-index:15}.card{background:#241a12;padding:20px;border-radius:16px;text-align:center}.ctrl{border:1px solid #ffffff55;background:#ffffff18;color:white;border-radius:999px;padding:7px 12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="bar"><strong>Skryté vinařské předměty</strong><span id="score">Nalezeno: 0 / 10</span><button class="ctrl" id="reset">Začít znovu</button></div><div class="game" id="game"><img alt="Vinařská hidden-object scéna" src="scene.jpg"><div class="done" id="done"><div class="card"><h2>Všechno nalezeno! 🍷</h2><button class="ctrl" id="again">Hrát znovu</button></div></div></div><section class="targets"><strong>NAJDI:</strong><div class="grid" id="grid"></div></section></div><div class="toast" id="toast"></div><script>const items=[['glass','Sklenka vína','🍷',70.9,56.1,3,10.7],['bottle','Láhev vína','🍾',73.4,50.1,3,14.3],['barrel','Sud','🛢️',68.1,23.9,10,21.5],['grapes','Hrozen','🍇',62.7,57.3,6,7.2],['cork','Korkový špunt','🟤',33.8,84.1,5,6],['corkscrew','Vývrtka','🗝️',37,87.1,7,7.2],['demijohn','Demižon','🏺',4.2,37,4.5,11.9],['winelist','Vinný list','📜',16.3,83.3,7,11.9],['press','Lis na hrozny','⚙️',78,20.3,6,23.9],['sign','Cedule','🪧',86.5,9.5,8,25.1]];const g=document.getElementById('game'),grid=document.getElementById('grid'),score=document.getElementById('score'),done=document.getElementById('done'),toast=document.getElementById('toast');let found=new Set(),timer;function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),900)}function update(){score.textContent=`Nalezeno: ${found.size} / ${items.length}`;if(found.size===items.length)done.style.display='grid'}items.forEach(a=>{const[id,n,ico,x,y,w,h]=a,b=document.createElement('button');b.className='hot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.onclick=e=>{e.stopPropagation();if(found.has(id))return;found.add(id);b.classList.add('found');const m=document.createElement('div');m.className='mark';m.textContent='✓';m.style.left=(x+w/2)+'%';m.style.top=(y+h/2)+'%';g.appendChild(m);document.querySelector(`[data-id="${id}"]`).classList.add('found');say('Nalezeno: '+n);update()};g.appendChild(b);const d=document.createElement('div');d.className='item';d.dataset.id=id;d.innerHTML=`<div style="font-size:28px">${ico}</div>${n}`;grid.appendChild(d)});function reset(){found.clear();done.style.display='none';document.querySelectorAll('.mark').forEach(x=>x.remove());document.querySelectorAll('.hot,.item').forEach(x=>x.classList.remove('found'));update()}document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;update()</script></body></html>
