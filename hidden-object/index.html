<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skryté vinařské předměty</title>
<style>
:root {--bg:#17120d;--panel:rgba(28,20,14,.96);--paper:#ead8ae;--ink:#33261a;--light:#fff8e9;--found:#47722a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--light);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh}.wrap{width:min(100vw,1844px);margin:0 auto}.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--panel);backdrop-filter:blur(8px);box-shadow:0 3px 16px rgba(0,0,0,.25)}.title{font-weight:800;letter-spacing:.02em}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}#score{font-weight:800;font-variant-numeric:tabular-nums}.ctrl{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.09);color:white;border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit}.game{position:relative;width:100%;line-height:0;user-select:none;touch-action:manipulation;overflow:hidden}.game img{display:block;width:100%;height:auto}.hotspot{position:absolute;z-index:10;border:0;padding:0;margin:0;background:transparent;cursor:pointer;border-radius:14px}.hotspot:focus-visible{outline:3px solid white;background:rgba(255,255,255,.12)}.hotspot.found{pointer-events:none}.mark{position:absolute;z-index:20;width:36px;height:36px;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:50%;border:3px solid white;background:rgba(71,114,42,.9);box-shadow:0 3px 14px rgba(0,0,0,.45);font-size:23px;line-height:1;pointer-events:none;animation:pop .2s ease-out}@keyframes pop{from{transform:translate(-50%,-50%) scale(.35);opacity:.2}to{transform:translate(-50%,-50%) scale(1);opacity:1}}.miss{position:absolute;z-index:19;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none}.miss:before,.miss:after{content:"";position:absolute;left:12px;top:1px;width:2px;height:24px;background:#c52d28}.miss:before{transform:rotate(45deg)}.miss:after{transform:rotate(-45deg)}.targets{background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,0)),var(--paper);color:var(--ink);border-top:4px solid #7b5429;padding:12px 14px 16px;box-shadow:inset 0 5px 15px rgba(70,42,15,.12)}.targets-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.targets-head strong{font-family:Georgia,serif;font-size:20px;letter-spacing:.04em}.hint{font-size:13px;opacity:.7}.target-grid{display:grid;grid-template-columns:repeat(10,minmax(95px,1fr));gap:8px}.target{min-height:78px;padding:8px 6px;border:1px solid rgba(75,49,22,.22);border-radius:10px;background:rgba(255,255,255,.27);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1;transition:.18s ease}.target .ico{font-size:29px;line-height:1;margin-bottom:6px}.target .name{font-size:12px;font-weight:750}.target.found{opacity:.42;filter:grayscale(1);text-decoration:line-through;transform:scale(.98)}.target.found .ico::after{content:" ✓";color:var(--found);filter:none}.toast{position:fixed;left:50%;bottom:18px;z-index:60;transform:translateX(-50%);background:rgba(0,0,0,.82);color:white;padding:9px 13px;border-radius:12px;opacity:0;transition:opacity .15s;pointer-events:none;max-width:min(90vw,600px);text-align:center}.toast.show{opacity:1}.done{display:none;position:absolute;inset:0;z-index:30;place-items:center;background:rgba(28,18,10,.58);line-height:1.25}.done-card{background:rgba(28,20,14,.96);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:22px 26px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.5)}@media(max-width:1050px){.target-grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:650px){.topbar{align-items:flex-start}.title{font-size:14px;max-width:45vw}.controls{font-size:13px;gap:6px}.ctrl{padding:6px 9px}.target-grid{grid-template-columns:repeat(2,1fr)}.target{min-height:64px}.targets-head{align-items:flex-start}.hint{max-width:48%;text-align:right}.mark{width:29px;height:29px;font-size:18px;border-width:2px}}
</style>
</head>
<body>
<div class="wrap"><div class="topbar"><div class="title">Skryté vinařské předměty</div><div class="controls"><span id="score">Nalezeno: 0 / 10</span><button class="ctrl" id="reset" type="button">Začít znovu</button></div></div><main><div class="game" id="game" aria-label="Vinařská hra se skrytými předměty"><img id="scene" alt="Vinařská hidden-object scéna" src="https://raw.githubusercontent.com/josefkrob/Damnice/main/hidden-object/scene.jpg"><div class="done" id="done"><div class="done-card"><h2>Všechno nalezeno! 🍷</h2><p>Našel jsi všech 10 vinařských předmětů.</p><button class="ctrl" id="again" type="button">Hrát znovu</button></div></div></div><section class="targets" aria-label="Seznam hledaných předmětů"><div class="targets-head"><strong>NAJDI:</strong><span class="hint">Nalezené předměty se automaticky odškrtnou.</span></div><div class="target-grid" id="targetGrid"></div></section></main></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const items=[{"id":"glass","name":"Sklenka vína","icon":"🍷","x":70.9,"y":56.071,"w":3,"h":10.737},{"id":"bottle","name":"Láhev vína","icon":"🍾","x":73.4,"y":50.106,"w":3,"h":14.316},{"id":"barrel","name":"Sud","icon":"🛢️","x":68.1,"y":23.86,"w":10,"h":21.474},{"id":"grapes","name":"Hrozen","icon":"🍇","x":62.7,"y":57.264,"w":6,"h":7.158},{"id":"cork","name":"Korkový špunt","icon":"🟤","x":33.8,"y":84.107,"w":5,"h":5.965},{"id":"corkscrew","name":"Vývrtka","icon":"🗝️","x":37,"y":87.09,"w":7,"h":7.158},{"id":"demijohn","name":"Demižon","icon":"🏺","x":4.2,"y":36.983,"w":4.5,"h":11.93},{"id":"winelist","name":"Vinný list","icon":"📜","x":16.3,"y":83.272,"w":7,"h":11.93},{"id":"press","name":"Lis na hrozny","icon":"⚙️","x":78,"y":20.281,"w":6,"h":23.86},{"id":"sign","name":"Cedule","icon":"🪧","x":86.5,"y":9.544,"w":8,"h":25.053}];const game=document.getElementById('game'),targetGrid=document.getElementById('targetGrid'),score=document.getElementById('score'),toast=document.getElementById('toast'),done=document.getElementById('done');let found=new Set(),toastTimer=null;function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1100)}function updateScore(){score.textContent=`Nalezeno: ${found.size} / ${items.length}`;if(found.size===items.length)done.style.display='grid'}function addMark(item){const mark=document.createElement('div');mark.className='mark';mark.dataset.for=item.id;mark.style.left=item.x+item.w/2+'%';mark.style.top=item.y+item.h/2+'%';mark.textContent='✓';game.appendChild(mark)}function markTarget(item){const t=document.querySelector(`.target[data-id="${item.id}"]`);if(t)t.classList.add('found')}function findItem(item,button){if(found.has(item.id))return;found.add(item.id);button.classList.add('found');addMark(item);markTarget(item);say(`Nalezeno: ${item.name}`);updateScore()}items.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='hotspot';b.dataset.id=item.id;b.setAttribute('aria-label',`Hledaný předmět: ${item.name}`);b.style.left=item.x+'%';b.style.top=item.y+'%';b.style.width=item.w+'%';b.style.height=item.h+'%';b.addEventListener('click',e=>{e.stopPropagation();findItem(item,b)});game.appendChild(b);const card=document.createElement('div');card.className='target';card.dataset.id=item.id;card.innerHTML=`<span class="ico">${item.icon}</span><span class="name">${item.name}</span>`;targetGrid.appendChild(card)});game.addEventListener('click',e=>{if(e.target.closest('.hotspot')||e.target.closest('.done'))return;const r=game.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,m=document.createElement('div');m.className='miss';m.style.left=x+'px';m.style.top=y+'px';game.appendChild(m);say('Tady nic není.');setTimeout(()=>m.remove(),550)});function resetGame(){found.clear();done.style.display='none';game.querySelectorAll('.mark,.miss').forEach(el=>el.remove());game.querySelectorAll('.hotspot').forEach(el=>el.classList.remove('found'));document.querySelectorAll('.target').forEach(el=>el.classList.remove('found'));updateScore();say('Hra byla obnovena.')}document.getElementById('reset').addEventListener('click',resetGame);document.getElementById('again').addEventListener('click',resetGame);updateScore();
</script>
</body>
</html>
