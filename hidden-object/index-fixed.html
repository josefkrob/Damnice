<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skryté vinařské předměty</title><style>html,body{margin:0;height:100%;background:#17120d}iframe{display:block;border:0;width:100%;height:100vh}</style></head><body><iframe id="g" src="game-inner.html" title="Skryté vinařské předměty"></iframe><script>const f=document.getElementById('g');f.addEventListener('load',()=>{try{const d=f.contentDocument,img=d.querySelector('img');if(!img)return;const s=img.getAttribute('src')||'';if(!s.startsWith('data:image/webp;base64,'))return;const p=s.indexOf(','),b=s.slice(p+1),h=atob(b.slice(0,16));const n=(h.charCodeAt(4)|(h.charCodeAt(5)<<8)|(h.charCodeAt(6)<<16)|(h.charCodeAt(7)<<24))+8;const need=Math.ceil(n/3)*4;img.src=s.slice(0,p+1)+b.slice(0,need)}catch(e){console.error(e)}})</script></body></html>
