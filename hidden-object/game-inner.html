</div></div><section class="targets"><strong>NAJDI:</strong><div class="grid" id="grid"></div></section></div><div class="toast" id="toast"></div><script>const items=[['glass','Sklenka vína','🍷',70.9,56.1,3,10.7],['bottle','Láhev vína','🍾',73.4,50.1,3,14.3],['barrel','Sud','🛢️',68.1,23.9,10,21.5],['grapes','Hrozen','🍇',62.7,57.3,6,7.2],['cork','Korkový špunt','🟤',33.8,84.1,5,6],['corkscrew','Vývrtka','🗝️',37,87.1,7,7.2],['demijohn','Demižon','🏺',4.2,37,4.5,11.9],['winelist','Vinný list','📜',16.3,83.3,7,11.9],['press','Lis na hrozny','⚙️',78,20.3,6,23.9],['sign','Cedule','🪧',86.5,9.5,8,25.1]];const g=document.getElementById('game'),grid=document.getElementById('grid'),score=document.getElementById('score'),done=document.getElementById('done'),toast=document.getElementById('toast');let found=new Set(),timer;function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),900)}function update(){score.textContent=`Nalezeno: ${found.size} / ${items.length}`;if(found.size===items.length)done.style.display='grid'}items.forEach(a=>{const[id,n,ico,x,y,w,h]=a,b=document.createElement('button');b.className='hot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.onclick=e=>{e.stopPropagation();if(found.has(id))return;found.add(id);b.classList.add('found');const m=document.createElement('div');m.className='mark';m.textContent='✓';m.style.left=(x+w/2)+'%';m.style.top=(y+h/2)+'%';g.appendChild(m);document.querySelector(`[data-id="${id}"]`).classList.add('found');say('Nalezeno: '+n);update()};g.appendChild(b);const d=document.createElement('div');d.className='item';d.dataset.id=id;d.innerHTML=`<div style="font-size:28px">${ico}</div>${n}`;grid.appendChild(d)});function reset(){found.clear();done.style.display='none';document.querySelectorAll('.mark').forEach(x=>x.remove());document.querySelectorAll('.hot,.item').forEach(x=>x.classList.remove('found'));update()}document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;update()</script></body></html>
